site_name: 复变函数从零到精通
site_description: 从零开始的复变函数讲义——从复数到共形映射，配 manim 动画可视化与知识点归纳
site_author: light
site_url: https://cockroach-f.github.io/complex-functions/
repo_url: https://github.com/cockroach-f/complex-functions
repo_name: cockroach-f/complex-functions
edit_uri: edit/main/docs/
use_directory_urls: false
copyright: Copyright &copy; 2026 light · 教学用途 · 参考华中科技大学《复变函数与积分变换》课程资料（未转载原 PPT/PDF）

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  social:
    - icon: material/radar
      link: https://cockroach-f.github.io/isar-tutorial/
      name: 姊妹站点：ISAR 目标识别入门与文献带读
    - icon: material/sine-wave
      link: https://cockroach-f.github.io/em-fields-waves/
      name: 姊妹站点：电磁场与电磁波从零到精通

nav:
  - 前言与知识地图: index.md
  - 第一部分 复数与函数:
      - 第 1 章 复数与复变函数: ch1.md
      - 第 2 章 解析函数: ch2.md
  - 第二部分 积分与级数:
      - 第 3 章 复变函数的积分: ch3.md
      - 第 4 章 解析函数的级数表示: ch4.md
  - 第三部分 留数与映射:
      - 第 5 章 留数及其应用: ch5.md
      - 第 6 章 共形映射: ch6.md
  - 全课程总结: summary.md
  - 附录:
      - 公式速查: formulas.md
      - 参考资料与致谢: references.md
  - 姊妹站点 · ISAR 文献带读: https://cockroach-f.github.io/isar-tutorial/
  - 姊妹站点 · 电磁场与电磁波从零到精通: https://cockroach-f.github.io/em-fields-waves/
